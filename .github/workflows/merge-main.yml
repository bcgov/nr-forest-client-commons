name: Merge to Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/*"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Set Variables
    outputs:
      digest: ${{ steps.pr.outputs.digest }}
      pr: ${{ steps.pr.outputs.pr }}
      semver: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      clean_changelog: ${{ steps.semver.outputs.clean_changelog }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Resolve the last built certextractor image (digest and PR) for main
      - name: PR Number
        id: pr
        uses: bcgov/actions/image-tracker@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          packages: certextractor
          max_depth: 100
      - name: Conventional Changelog Update
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        id: semver
        with:
          git-branch: refs/heads/${{ github.head_ref }}
          git-push: "false"
          skip-commit: "true"
          skip-on-empty: "false"
          skip-version-file: "true"

  certextractor:
    name: Promote certextractor
    needs: [vars]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/certextractor
          # Promote by digest: the PR tag carries the semver from build time, which goes stale
          target: ${{ needs.vars.outputs.digest }}
          tags: ${{ needs.vars.outputs.semver }}

  tagging:
    name: Tagging library
    needs: [vars, certextractor]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        if: needs.vars.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.vars.outputs.tag }}
          name: ${{ needs.vars.outputs.tag }}
          body: |
            ${{ needs.vars.outputs.clean_changelog }}

            The Cert Extractor image is available at:
            `ghcr.io/${{ github.repository }}/certextractor:${{ needs.vars.outputs.semver }}`


  notify:
    name: Notify on Failure
    needs: [vars, certextractor, tagging]
    if: failure()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bcgov/actions/workflow-notifier@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
