name: Pull Request Open

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  # Queue rather than cancel: a cancelled run would leave a failed results check on the same commit
  cancel-in-progress: false

permissions: {}

jobs:
  vars:
    name: Variables
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      # steps.semver.outputs.tag => needs.vars.outputs.semver
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
      - name: Conventional Changelog Update
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        id: semver
        with:
          git-branch: refs/heads/${{ github.head_ref }}
          git-push: "false"
          skip-commit: "true"
          skip-on-empty: "false"
          skip-version-file: "true"

      - run: |
          echo "semver=${{ steps.semver.outputs.version }}"
          echo "tag=${{ steps.semver.outputs.tag }}"


  build-certextractor:
    name: Builds Cert Extractor
    runs-on: ubuntu-24.04
    needs: [vars]
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: bcgov/actions/builder@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        name: Build Cert Extractor
        id: build
        with:
          package: certextractor
          tags: ${{needs.vars.outputs.semver}}.PR${{ github.event.number }}
          tag_fallback: test
          token: ${{ secrets.GITHUB_TOKEN }}
          triggers: "certextractor/"
          build_args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ needs.vars.outputs.semver }}.PR${{ github.event.number }}

  smoke-certextractor:
    name: Cert Extractor Smoke Test
    runs-on: ubuntu-24.04
    needs: [build-certextractor]
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Smoke test the built image
        env:
          DIGEST: ${{ needs.build-certextractor.outputs.digest }}
        run: |
          [ -n "${DIGEST}" ] || { echo "No image digest from the build job"; exit 1; }
          ./certextractor/smoke-test.sh "ghcr.io/${GITHUB_REPOSITORY,,}/certextractor@${DIGEST}"

  results:
    name: PR Results
    needs: [vars, build-certextractor, smoke-certextractor]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
          title: "PR Results"
