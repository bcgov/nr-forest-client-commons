name: .Tests

on:
  workflow_call:
    secrets:
      sonar_token:
        description: SonarCloud token; analysis is skipped when empty
        required: false

permissions: {}

jobs:
  tests-java:
    name: Library Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: bcgov/action-test-and-analyse-java@a8e35510683d3d916e4366a44b2d5cb61d0f23fe # v.1.2.0
        name: Core Tests
        with:
          commands: |
            mvn -B verify -P all-tests checkstyle:checkstyle -Dcheckstyle.skip=false --file pom.xml
          dir: core
          java-cache: maven
          java-distribution: temurin
          java-version: "17"
          sonar_args: >
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=bcgov_nr-forest-client-commons
          sonar_token: ${{ secrets.sonar_token }}

      - name: Archive CycloneDX
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cyclone-backend
          path: |
            core/target/bom.json
          retention-days: 5

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        continue-on-error: true
        if: github.event_name == 'pull_request' && (success() || failure())
        with:
          report_paths: core/target/**/TEST-*.xml
          commit: ${{ github.event.pull_request.head.sha }}
          summary: Pull Request Tests for Core Library
          detailed_summary: true
          job_name: Core Library Tests

      - name: Add coverage to PR
        id: jacoco
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: core/target/coverage-reports/merged-test-report/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 75
          min-coverage-changed-files: 75
